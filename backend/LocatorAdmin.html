<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#172033;color:white;padding:14px 16px;z-index:2}.top b{font-size:18px}.wrap{max-width:900px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button,.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.tabs button.active,.primary{background:#2563eb;color:white}.panel{background:white;border:1px solid #d9e0ea;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700}input,textarea,select{width:100%;padding:9px;border:1px solid #c9d2df;border-radius:7px;margin-top:5px}textarea{resize:vertical}.muted{color:#697386;font-size:12px}.status{padding:9px;border-radius:8px;background:#e8eefb;margin:10px 0}.good{background:#e7f7ed}.bad{background:#feeceb}.row{display:grid;grid-template-columns:28px 1.4fr 1fr 1fr .8fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:12px}.hide{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:28px 1fr}.row span:nth-child(n+3){display:none}}
</style></head><body><div class="top"><b>Apartment Pros Admin</b><div class="muted" style="color:#c9d2df">Messaging + application follow-up</div></div><main class="wrap">
<div class="panel"><label>Locator API key<input id="key" type="password" autocomplete="current-password"></label><button class="btn primary" id="saveKey" style="margin-top:8px">Save on this device</button><p class="muted">The key is stored only in this browser's local storage on the Apps Script origin.</p></div>
<div class="tabs"><button id="tabMsg" class="active">Messages</button><button id="tabFollow">Applications</button></div><div id="status" class="status">Ready.</div>
<section id="messages"><div class="grid"><form id="contactForm" class="panel grid"><h2 class="full">Client contact</h2><label>Contact ID<input name="contactId"></label><label>Name<input name="clientName" required></label><label>Phone<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Lease end<input name="leaseEndDate" type="date"></label><label>Tags<input name="tags"></label><label><input name="smsConsent" type="checkbox" style="width:auto"> SMS consent recorded</label><label><input name="optedOut" type="checkbox" style="width:auto"> Opted out</label><label class="full">Notes<textarea name="notes" rows="3"></textarea></label><button class="btn primary full">Save client</button></form>
<div class="panel"><h2>Send housing / lease message</h2><label>Lease ends within<select id="window"><option value="30">30 days</option><option value="60">60 days</option><option value="90" selected>90 days</option><option value="180">180 days</option><option value="365">1 year</option></select></label><label>Search<input id="search"></label><label>Template<textarea id="template" rows="7">Hi {{firstName}}, this is Avrey. Your lease end date is coming up on {{leaseEndDate}}. I can send you current apartment deals or help compare renewal vs moving. Reply STOP to opt out.</textarea></label><button class="btn primary" id="send">Send to selected consented clients</button><p class="muted">Contacts without recorded consent or marked opted out are skipped by the server.</p></div></div><div class="panel"><button class="btn" id="load">Refresh contacts</button><div id="contacts"></div></div></section>
<section id="follow" class="hide"><div class="grid"><form id="followForm" class="panel grid"><h2 class="full">Application follow-up</h2><label>Follow-up ID<input name="followUpId"></label><label>Submission ID<input name="submissionId"></label><label>Floorplan ID<input name="floorplanId"></label><label>Community ID<input name="communityId"></label><label>Client name<input name="clientName"></label><label>Client email<input name="clientEmail"></label><label>Client phone<input name="clientPhone"></label><label><input name="applied" type="checkbox" style="width:auto"> Applied</label><label>Application date<input name="applicationDate" type="date"></label><label>Outcome<select name="outcome"><option></option><option>Pending</option><option>Approved</option><option>Conditionally approved</option><option>Denied</option><option>Client did not apply</option><option>Leased elsewhere</option></select></label><label>Follow-up date<input name="followUpDate" type="date"></label><label>Status<select name="followUpStatus"><option>Open</option><option>Waiting</option><option>Completed</option><option>Closed</option></select></label><label class="full">Notes<textarea name="notes" rows="4"></textarea></label><button class="btn primary full">Save follow-up</button></form><div class="panel"><button class="btn" id="loadFollow">Refresh follow-ups</button><div id="followRows"></div></div></div></section>
</main><script>
let contacts=[],followups=[];const $=s=>document.querySelector(s);function key(){return localStorage.getItem('locatorAdminKey')||''}function status(t,bad=false){$('#status').textContent=t;$('#status').className='status '+(bad?'bad':'good')}function call(action,data={}){return new Promise((res,rej)=>{const k=key();if(!k)return rej(new Error('Save the Locator API key first.'));google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message||String(e)))).locatorAdminWebAction(k,{action,...data});})}
$('#key').value=key();$('#saveKey').onclick=()=>{localStorage.setItem('locatorAdminKey',$('#key').value.trim());status('Key saved on this device.')};function tab(which){$('#messages').classList.toggle('hide',which!=='m');$('#follow').classList.toggle('hide',which!=='f');$('#tabMsg').classList.toggle('active',which==='m');$('#tabFollow').classList.toggle('active',which==='f')}$('#tabMsg').onclick=()=>tab('m');$('#tabFollow').onclick=()=>tab('f');
function days(d){if(!d)return 99999;return Math.ceil((new Date(d+'T12:00:00')-Date.now())/86400000)}function renderContacts(){const w=Number($('#window').value),q=$('#search').value.toLowerCase();const list=contacts.filter(c=>days(c.leaseEndDate)<=w&&days(c.leaseEndDate)>=-30&&(!q||[c.clientName,c.phone,c.email,c.tags].join(' ').toLowerCase().includes(q)));$('#contacts').innerHTML=list.map(c=>`<label class="row"><input type="checkbox" data-id="${esc(c.contactId)}" ${c.smsConsent&&!c.optedOut?'':'disabled'}><span><b>${esc(c.clientName)}</b><br>${esc(c.phone)}</span><span>${esc(c.leaseEndDate||'')}</span><span>${c.optedOut?'Opted out':c.smsConsent?'Consent':'No consent'}</span><span>${esc(c.tags||'')}</span></label>`).join('')||'<p class="muted">No matching contacts.</p>'}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{status('Loading…');const r=await call('locatorListMessageContacts');contacts=r.contacts||[];renderContacts();status(contacts.length+' contacts loaded.')}catch(e){status(e.message,true)}}$('#load').onclick=load;$('#window').onchange=renderContacts;$('#search').oninput=renderContacts;
$('#contactForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;try{const c={contactId:f.contactId.value.trim(),clientName:f.clientName.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim(),leaseEndDate:f.leaseEndDate.value,smsConsent:f.smsConsent.checked,optedOut:f.optedOut.checked,tags:f.tags.value.trim(),notes:f.notes.value.trim()};const r=await call('locatorUpsertMessageContact',{contact:c});status('Saved '+r.contactId);f.reset();await load()}catch(x){status(x.message,true)}};
$('#send').onclick=async()=>{const ids=[...document.querySelectorAll('[data-id]:checked')].map(x=>x.dataset.id),template=$('#template').value.trim();if(!ids.length)return status('Select consented contacts.',true);if(!confirm('Send to '+ids.length+' contact(s)?'))return;try{status('Sending…');const r=await call('locatorSendSmsBatch',{contactIds:ids,template});status('Sent '+(r.sentCount||0)+'; skipped '+(r.skippedCount||0)+'.');}catch(e){status(e.message,true)}};
function renderFollow(){const list=[...followups].sort((a,b)=>String(a.FollowUpDate||'').localeCompare(String(b.FollowUpDate||'')));$('#followRows').innerHTML=list.map(r=>`<div class="panel"><b>${esc(r.ClientName||'Client')}</b> · ${esc(r.FollowUpStatus||'')}<br><span class="muted">${esc(r.FloorplanID||'')} · follow up ${esc(r.FollowUpDate||'')} · ${esc(r.Outcome||'')}</span></div>`).join('')||'<p class="muted">No follow-ups yet.</p>'}async function loadFollow(){try{const r=await call('locatorListApplicationFollowUps');followups=r.followUps||[];renderFollow();status(followups.length+' follow-ups loaded.')}catch(e){status(e.message,true)}}$('#loadFollow').onclick=loadFollow;
$('#followForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const o=Object.fromEntries(new FormData(f).entries());o.applied=f.applied.checked;try{const r=await call('locatorUpsertApplicationFollowUp',{followUp:o});status('Saved '+r.followUpId);f.reset();await loadFollow()}catch(x){status(x.message,true)}};
</script></body></html>
